name: Publish BLUE COURT and daily journal
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blue-court-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original journal articles
        run: python scripts/daily_blog.py
      - name: Commit article data and sitemap
        shell: bash
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard blog sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/posts.json blog sitemap.xml
            if ! git diff --cached --quiet; then
              git commit -m "content: publish BLUE COURT daily journal"
              git push
            fi
          fi
      - name: Configure GitHub Pages (optional mirror)
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload static website
        if: steps.pages_setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        if: steps.pages_setup.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v4
