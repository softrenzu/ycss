name: Publish daily YSCC football blog

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron is UTC: 01:10 UTC = 10:10 JST every day.
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blue-court-daily-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish today's football article and rebuild sitemap
        run: python scripts/daily_blog.py
      - name: Validate football edition (no futsal or F.League crosslinks)
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/matches.json >/dev/null
          python -m json.tool data/posts.json >/dev/null
          if grep -RilE 'ysccfutsal|fleague\.jp|more\.tiget\.net|F\.LEAGUE' index.html app.js scripts/daily_blog.py data blog --include='*.html' --include='*.py' --include='*.js' --include='*.json'; then
            echo 'Old futsal content detected'
            exit 1
          fi
          test -s "blog/$(TZ=Asia/Tokyo date +%Y-%m-%d)-daily-football.html" || test -s blog/2026-11-13-verspah-home.html
      - name: Commit new article files
        shell: bash
        run: |
          set -euo pipefail
          git add data/posts.json blog sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'content: publish YSCC daily football journal'
            git push
          else
            echo 'Today is already published; no duplicate post.'
          fi
